server {
    listen 8080;
    server_name localhost;

    root /home/blackjew/labs/secure_bank/frontend/dist;
    index index.html;

    # API calls go to the backend (gunicorn on 127.0.0.1:5000).
    # Because the browser only ever talks to this one origin (localhost:8080),
    # there's no cross-origin request happening at all - no CORS config
    # needed, and cookies behave like any ordinary same-origin cookie.
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React Router uses client-side routing (e.g. /dashboard, /cards) -
    # any path that isn't a real file falls back to index.html so the
    # router can take over instead of nginx 404ing on a refresh.
    location / {
        try_files $uri /index.html;
    }
}
