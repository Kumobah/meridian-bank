services:
  postgres:
    image: postgres:16-alpine
    container_name: meridian_bank_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: bank_user
      POSTGRES_PASSWORD: bank_pass
      POSTGRES_DB: meridian_bank
    ports:
      - "5432:5432"
    volumes:
      - meridian_bank_data:/var/lib/postgresql/data

volumes:
  meridian_bank_data:
